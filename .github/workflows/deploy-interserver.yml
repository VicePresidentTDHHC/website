# Deploy www/ to InterServer whenever master changes.
# Settings → Secrets and variables → Actions → Secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Host: vda8600.is.cc  User: tdhhcorg  Path: ./public_html/
# Bolt → GitHub master → this workflow → InterServer.

name: Deploy www to InterServer

on:
  push:
    branches:
      - master
    paths:
      - "www/**"
      - ".github/workflows/deploy-interserver.yml"
  workflow_dispatch:

concurrency:
  group: deploy-interserver
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP sync www/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync www/ to InterServer
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./www/
          server-dir: ./public_html/
          protocol: ftp
          timeout: 60000
