# Deploy www/ to InterServer whenever master changes.
# Settings → Secrets and variables → Actions:
#   Variables: FTP_SERVER (HOST_IP), FTP_USERNAME (TDHHCORG_USER_NAME)
#   Secrets:   FTP_PASSWORD (TDHHCORG_PW)
# Does NOT change DNS. Live tdhhc.org stays on the old host until the Board votes.

name: Deploy www to InterServer

on:
  push:
    branches:
      - master
    paths:
      - "www/**"
      - ".github/workflows/deploy-interserver.yml"
  workflow_dispatch:

concurrency:
  group: deploy-interserver
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP sync www/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync www/ to InterServer
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./www/
          server-dir: ./public_html/
          protocol: ftp
          timeout: 60000
