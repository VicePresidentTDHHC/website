# Deploy www/ to Hosting.com whenever master changes.
# Settings → Secrets and variables → Actions → Secrets:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# FTP home is /home/aslexpre/public_html/tdhhc_mockup (https://aslexpress.net/tdhhc_mockup/).
# FTP_SERVER must be origin IP 75.98.175.84 (not Cloudflare ftp.aslexpress.net).
# Does NOT change DNS. Live tdhhc.org stays on the old host until the Board votes.

name: Deploy www to Hosting.com

on:
  push:
    branches:
      - master
    paths:
      - "www/**"
      - ".github/workflows/deploy-hosting.yml"
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP sync www/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync www/ to Hosting.com
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./www/
          server-dir: ./
          protocol: ftp
          timeout: 60000
