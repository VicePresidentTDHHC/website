<!DOCTYPE html>
<html lang="en" data-theme="v4">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter PDF | TDHHC</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" href="../assets/favicon-teal.svg" type="image/svg+xml">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <style>
    body { margin: 0; }
    #pdf-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      background: var(--color-surface, #f5f5f5);
      min-height: 100vh;
    }
    #pdf-container canvas {
      display: block;
      width: 100%;
      max-width: 900px;
      height: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      border-radius: 4px;
    }
    #pdf-fallback {
      display: none;
      padding: 3rem 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="pdf-container"></div>
  <div id="pdf-fallback">
    <p>The PDF could not be displayed in the browser.</p>
    <p><a id="pdf-fallback-link" href="#" download>Download the PDF</a></p>
  </div>
  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var pdfUrl = params.get('file') || '../assets/newsletters/tdhhc-september-newsletter.pdf';

    var fallback = document.getElementById('pdf-fallback');
    var fallbackLink = document.getElementById('pdf-fallback-link');
    fallbackLink.href = pdfUrl;

    function showFallback() {
      document.getElementById('pdf-container').style.display = 'none';
      fallback.style.display = 'block';
    }

    function renderPDF() {
      if (typeof window.pdfjsLib === 'undefined') { showFallback(); return; }
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      var container = document.getElementById('pdf-container');

      window.pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
        function renderNext(pageNum) {
          if (pageNum > pdf.numPages) return;
          pdf.getPage(pageNum).then(function(page) {
            var maxWidth = Math.min(container.clientWidth - 32, 900);
            var scale = maxWidth / page.getViewport({ scale: 1 }).width;
            var viewport = page.getViewport({ scale: scale });
            var canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            container.appendChild(canvas);
            page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise.then(function() {
              renderNext(pageNum + 1);
            }, showFallback);
          }).catch(showFallback);
        }
        renderNext(1);
      }).catch(showFallback);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', renderPDF);
    } else {
      renderPDF();
    }
  })();
  </script>
</body>
</html>
